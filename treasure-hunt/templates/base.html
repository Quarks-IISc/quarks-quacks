<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Treasure Hunt{% endblock %} — Duck Duck Loot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #151515;
            --card-raised: #1c1c1c;
            --border: #2a2a2a;
            --text: #e0ddd8;
            --text-dim: #8a8780;
            --accent: #d4a843;
            --accent-hover: #e6c05a;
            --secondary: #6ba3a5;
            --coral: #c47a6a;
            --info: #8b85c9;
            --danger: #c95050;
            --success: #4aaa60;
            --font-pixel: "Press Start 2P", monospace;
            --pixel-corner: polygon(0 6px, 6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px));
            --pixel-sm: polygon(0 4px, 4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px));
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Inter", sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            min-height: 100dvh;
        }
        ::selection { background: var(--secondary); color: var(--bg); }

        h1, h2 { font-family: "Caveat", cursive; font-weight: 700; line-height: 1.1; }
        h1 { font-size: 2rem; }
        h2 { font-size: 1.4rem; }
        h3 { font-size: 1rem; font-weight: 600; }

        .nav {
            position: sticky;
            top: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1.2rem;
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--border);
        }
        .nav-brand {
            font-family: "Caveat", cursive;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            text-decoration: none;
        }
        .nav-brand span { color: var(--accent); }
        .nav-brand:hover { color: var(--text); }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            margin-left: auto;
        }
        .nav-links a {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 0.9rem;
            clip-path: var(--pixel-sm);
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
        }
        .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .nav-links a.is-active { color: var(--accent); background: rgba(212,168,67,0.08); }

        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 1.5rem 16px 3rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            clip-path: var(--pixel-corner);
            padding: 1.2rem 1.4rem;
            margin: 1rem 0;
        }
        .card h2 { color: var(--accent); margin-bottom: 0.5rem; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            border: none;
            clip-path: var(--pixel-sm);
            background: var(--accent);
            color: var(--bg);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--secondary); }
        .btn-secondary:hover { background: #85b8ba; }
        .btn-danger { background: var(--danger); color: var(--text); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        input, select, textarea {
            width: 100%;
            padding: 0.65rem 0.8rem;
            border: 1px solid var(--border);
            background: var(--card-raised);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            clip-path: var(--pixel-sm);
            outline: none;
            margin-top: 0.3rem;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }

        label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-top: 0.8rem; }
        label:first-child { margin-top: 0; }

        .text-dim { color: var(--text-dim); }
        .text-accent { color: var(--accent); }
        .text-success { color: var(--success); }

        a { color: var(--secondary); text-decoration: none; }
        a:hover { color: var(--accent); }

        .points-big { font-family: var(--font-pixel); font-size: 1.8rem; color: var(--accent); }

        .badge {
            display: inline-block;
            font-family: var(--font-pixel);
            font-size: 0.5rem;
            padding: 0.2rem 0.5rem;
            clip-path: var(--pixel-sm);
            background: var(--secondary);
            color: var(--bg);
            letter-spacing: 1px;
        }
        .badge-success { background: var(--success); }
        .badge-coral { background: var(--coral); }

        ul { list-style: none; }
        li { margin: 0.6rem 0; }

        .quest-item {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.6rem 0; border-bottom: 1px solid var(--border);
        }
        .quest-item:last-child { border-bottom: none; }
        .quest-item .icon { font-size: 1.2rem; color: var(--success); }

        .alert {
            padding: 0.8rem 1rem;
            clip-path: var(--pixel-sm);
            margin: 0.8rem 0;
            font-size: 0.85rem;
        }
        .alert-success { background: rgba(74,170,96,0.15); color: var(--success); border: 1px solid var(--success); }
        .alert-danger { background: rgba(201,80,80,0.15); color: var(--danger); border: 1px solid var(--danger); }
        .alert-info { background: rgba(107,163,165,0.15); color: var(--secondary); border: 1px solid var(--secondary); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .fade-in { animation: fadeIn 0.3s ease; }

        @media (max-width: 480px) {
            .points-big { font-size: 1.4rem; }
            .card { padding: 1rem; }
            .nav-links a { padding: 0.4rem 0.6rem; font-size: 0.78rem; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="nav">
        <a href="{{ base }}/dashboard" class="nav-brand">Quarks <span>Quacks</span></a>
        <div class="nav-links">
            <a href="{{ base }}/dashboard" class="is-active"><i class="fas fa-search-location"></i> Hunt</a>
            <a href="{{ base }}/leaderboard"><i class="fas fa-trophy"></i> Leaderboard</a>
            <a href="/" id="home-link"><i class="fas fa-home"></i> Quacks Day</a>
        </div>
    </nav>
    <div class="container fade-in">
        {% block content %}{% endblock %}
    </div>
    <script>
        var host = window.location.hostname;
        var homeLink = document.getElementById('home-link');
        if (homeLink) homeLink.href = 'http://' + host + ':3001';
    </script>
</body>
</html>
