{% extends "base.html" %}
{% block title %}Team Login{% endblock %}
{% block content %}
<div class="card">
    <h2><i class="fas fa-sign-in-alt"></i> Team Login</h2>
    <p class="text-dim" style="margin-bottom:0.5rem">Log in to your team to continue the hunt.</p>

    <form action="{{ base }}/login" method="post">
        <input type="hidden" name="next" value="{{ next }}">

        <label for="team_name">Team Name</label>
        <input id="team_name" name="team_name" type="text" required autocomplete="username" placeholder="Enter your team name">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter password">

        <div style="margin-top:1.2rem">
            <button type="submit" class="btn" style="width:100%;justify-content:center">
                <i class="fas fa-arrow-right"></i> Log In
            </button>
        </div>
    </form>
</div>
{% endblock %}
